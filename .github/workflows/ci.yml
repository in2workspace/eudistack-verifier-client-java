name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # shallow clones disabled for better SonarQube relevancy

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and test
        run: ./gradlew check --no-daemon

      # Dependabot-triggered runs don't get repo secrets (GitHub withholds them from
      # pull_request events opened by Dependabot, by design) — SONAR_TOKEN is empty there
      # and the sonar task fails outright rather than skipping. Only run it when the
      # secret is actually available, so those PRs go green on the real quality gate
      # (build/test/checkstyle/coverage) without a Sonar analysis attempt that can't work.
      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew sonar --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7
